<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kavun 8.1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#0f1712;--bg2:#16221a;--bg3:#1f3024;--hover:#2a4030;--acc:#2ecc71;--acc2:#58d68d;--txt:#e8f0ea;--txt2:#88a896;--mut:#557061;--brd:#2a4030;--ok:#2ecc71;--err:#e74c3c;--out:#27ae60;--in:#1f3024;--g1:linear-gradient(135deg,#27ae60,#2ecc71);--g2:linear-gradient(135deg,#e74c3c,#ff7979);--r:16px;--rs:10px}
[data-theme=ocean]{--bg:#0a1929;--bg2:#132f4c;--bg3:#173a5e;--hover:#1e4976;--acc:#3498db;--acc2:#5dade2;--brd:#1e4976;--out:#2980b9;--in:#173a5e;--g1:linear-gradient(135deg,#2980b9,#3498db);--txt:#eaf3fc;--txt2:#88a8c8}
[data-theme=dark]{--bg:#000;--bg2:#0d0d0d;--bg3:#1a1a1a;--hover:#262626;--acc:#fff;--acc2:#ccc;--brd:#262626;--out:#333;--in:#1a1a1a;--g1:linear-gradient(135deg,#333,#666);--txt:#fff;--txt2:#888}
[data-theme=light]{--bg:#fff;--bg2:#f5f5f5;--bg3:#e8e8e8;--hover:#ddd;--acc:#2ecc71;--brd:#ccc;--out:#2ecc71;--in:#e8e8e8;--g1:linear-gradient(135deg,#27ae60,#2ecc71);--txt:#1a1a1a;--txt2:#666;--mut:#999}
[data-wall=p1] .msgs{background:radial-gradient(circle at 20% 30%,rgba(46,204,113,.1),transparent 50%)}
[data-wall=p2] .msgs{background-image:radial-gradient(circle,var(--brd) 1px,transparent 1px);background-size:18px 18px}
[data-wall=custom] .msgs{background-size:cover;background-position:center}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:8px}

/* AUTH */
.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;background:var(--bg);transition:.4s}
.auth.hide{opacity:0;visibility:hidden;pointer-events:none}
.auth-box{width:400px;max-width:95vw;padding:40px 28px;background:var(--bg2);border-radius:24px;border:1px solid var(--brd);text-align:center}
.logo{width:70px;height:70px;border-radius:50%;background:var(--g2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px}
.auth-box h1{font-size:26px;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:4px;margin:18px 0}
.tab{flex:1;padding:10px;border:none;background:0;color:var(--txt2);border-radius:8px;cursor:pointer;font-weight:500}
.tab.on{background:var(--acc);color:var(--bg);font-weight:700}
.ig{position:relative;margin-bottom:12px}
.ig i{position:absolute;left:14px;top:14px;color:var(--mut);font-size:13px}
.ig input{width:100%;padding:12px 14px 12px 40px;background:var(--bg3);border:1px solid var(--brd);border-radius:10px;color:var(--txt);outline:0;font-family:inherit}
.btn{width:100%;padding:12px;background:var(--g1);border:none;border-radius:10px;color:var(--bg);font-weight:700;cursor:pointer;margin-top:6px}
.err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
.av-up label{width:64px;height:64px;border-radius:50%;background:var(--bg3);border:2px dashed var(--brd);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;cursor:pointer;overflow:hidden}
.av-up label img{width:100%;height:100%;object-fit:cover}
.reg{display:none}.reg.on{display:block}

/* APP */
.app{display:flex;height:100vh;opacity:0;visibility:hidden;transition:.4s}
.app.on{opacity:1;visibility:visible}
.side{width:340px;background:var(--bg2);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0}
.side-h{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--brd)}
.side-h h2{font-size:20px;background:var(--g2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ib{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg3);color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--acc);color:var(--bg)}
.tbar{display:flex;padding:8px;gap:4px;overflow-x:auto;border-bottom:1px solid var(--brd)}
.tbar button{padding:6px 10px;border:none;background:0;color:var(--mut);border-radius:16px;cursor:pointer;white-space:nowrap;font-size:12px}
.tbar button.on{background:var(--acc);color:var(--bg);font-weight:700}
.clist{flex:1;overflow-y:auto;padding:6px}
.ci{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;position:relative}
.ci:hover{background:var(--hover)}.ci.on{background:var(--bg3);border:1px solid var(--brd)}
.ca{width:46px;height:46px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--bg);overflow:hidden;flex-shrink:0;position:relative}
.ca img{width:100%;height:100%;object-fit:cover}
.dot{width:11px;height:11px;background:var(--ok);border:2px solid var(--bg2);border-radius:50%;position:absolute;bottom:0;right:0}
.ub{min-width:18px;height:18px;background:var(--err);border-radius:9px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;color:#fff}

.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.ch{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd);background:var(--bg2)}
.chi{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
.mw{display:flex;flex-direction:column;max-width:70%;position:relative}
.mw.s{align-self:flex-end;align-items:flex-end}.mw.r{align-self:flex-start}
.mw.sys{align-self:center;max-width:90%}
.m{padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.mw.s .m{background:var(--out);color:var(--bg);border-bottom-right-radius:4px;font-weight:500}
.mw.r .m{background:var(--in);border:1px solid var(--brd);border-bottom-left-radius:4px}
.mw.sys .m{background:var(--bg3);color:var(--txt2);font-size:12px;text-align:center;padding:6px 12px;border-radius:20px}
.mt{font-size:10px;color:var(--mut);margin-top:2px;padding:0 4px;display:flex;gap:4px;align-items:center}
.mw.s .mt{flex-direction:row-reverse}
.checks{color:var(--acc2);font-size:11px}
.mm{max-width:260px;border-radius:12px;overflow:hidden;margin-bottom:4px;cursor:pointer}
.mm img,.mm video{width:100%;display:block}
.vc{width:160px;height:160px;border-radius:50%;overflow:hidden;border:3px solid var(--acc);cursor:pointer}
.vc video{width:100%;height:100%;object-fit:cover}
.vm{display:flex;align-items:center;gap:8px;min-width:160px}
.vm button{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:inherit;cursor:pointer}
.st{width:110px;height:110px;display:flex;align-items:center;justify-content:center;font-size:70px}
.st img{width:100%;height:100%;object-fit:contain}
.ma{position:absolute;top:-28px;opacity:0;transition:.15s;background:var(--bg2);border-radius:16px;padding:2px 4px;display:flex;gap:2px;border:1px solid var(--brd);z-index:5}
.mw.s .ma{right:0}.mw.r .ma{left:0}
.mw:hover .ma{opacity:1}
.ma button{background:0;border:none;color:var(--txt2);cursor:pointer;padding:3px 5px;font-size:12px;border-radius:50%}
.ma button:hover{background:var(--hover);color:var(--acc)}
.reacts{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.re{padding:1px 6px;background:var(--bg3);border:1px solid var(--brd);border-radius:10px;cursor:pointer;font-size:12px}
.re.on{border-color:var(--acc);background:rgba(46,204,113,.15)}
.rp{background:rgba(46,204,113,.1);border-left:3px solid var(--acc);padding:5px 8px;margin-bottom:4px;border-radius:6px;font-size:12px;cursor:pointer}
.rp .n{color:var(--acc);font-weight:600}

.ia{padding:10px 14px;border-top:1px solid var(--brd);background:var(--bg2)}
.ibar{display:flex;gap:6px;align-items:flex-end;position:relative}
.it{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--brd);border-radius:22px;color:var(--txt);outline:0;resize:none;max-height:100px;min-height:40px;font-family:inherit;font-size:14px}
.sb{width:42px;height:42px;border-radius:50%;border:none;background:var(--g1);color:var(--bg);cursor:pointer;flex-shrink:0}
.ab{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg3);color:var(--txt2);cursor:pointer;flex-shrink:0}
.ab:hover{background:var(--acc);color:var(--bg)}
.pm{position:absolute;bottom:50px;left:0;background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:6px;display:none;z-index:20;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pm.show{display:block}
.pm button{display:flex;align-items:center;gap:8px;padding:9px 12px;background:0;border:none;color:var(--txt);cursor:pointer;width:100%;border-radius:8px;font-family:inherit;text-align:left}
.pm button:hover{background:var(--hover)}
.pm button i{color:var(--acc);width:18px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:900;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{width:420px;max-width:100%;background:var(--bg2);border-radius:16px;padding:22px;border:1px solid var(--brd);max-height:90vh;overflow-y:auto}
.md h3{text-align:center;margin-bottom:14px}
.bc{flex:1;padding:11px;border:none;border-radius:10px;background:var(--bg3);color:var(--txt2);cursor:pointer;font-weight:600}
.ss{margin-bottom:16px}
.ss h4{font-size:12px;text-transform:uppercase;color:var(--mut);margin-bottom:8px;letter-spacing:1px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.to{padding:10px;border-radius:10px;cursor:pointer;text-align:center;border:2px solid transparent;background:var(--bg3)}
.to.on{border-color:var(--acc)}
.tp{height:32px;border-radius:6px;margin-bottom:4px}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wo{height:54px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.wo.on{border-color:var(--acc)}
.sw{position:relative;display:inline-block;width:42px;height:22px}
.sw input{display:none}
.sw .sl{position:absolute;inset:0;background:var(--bg3);border-radius:22px;cursor:pointer}
.sw .sl:before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.sw input:checked+.sl{background:var(--acc)}
.sw input:checked+.sl:before{transform:translateX(20px)}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.uri{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.uri:hover{background:var(--hover)}
.pv{text-align:center}
.abig{width:90px;height:90px;border-radius:50%;margin:0 auto 12px;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--bg);overflow:hidden}
.abig img{width:100%;height:100%;object-fit:cover}
.pacts{display:flex;gap:8px;margin:12px 0}
.pacts button{flex:1;padding:10px;border:none;border-radius:10px;cursor:pointer;font-weight:600}

/* CALL */
.cs{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center}
.cs.on{display:flex}
.cal{width:110px;height:110px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:20px;overflow:hidden;color:var(--bg)}
.cal img{width:100%;height:100%;object-fit:cover}
.vcc{position:fixed;inset:0;z-index:2000;background:#000;display:none}
.vcc.on{display:flex}
.vg{width:100%;height:100%;display:grid;gap:4px;padding:4px}
.vg.g1{grid-template-columns:1fr}.vg.g2{grid-template-columns:1fr 1fr}
.vi{background:#111;border-radius:10px;overflow:hidden;position:relative}
.vi video{width:100%;height:100%;object-fit:cover}
.vi.loc video{transform:scaleX(-1)}
.vi .nt{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;padding:3px 7px;border-radius:5px;font-size:11px}
.cc{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10;background:rgba(0,0,0,.5);padding:10px;border-radius:36px}
.cb{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;font-size:18px;color:#fff;display:flex;align-items:center;justify-content:center}
.cb.ok{background:var(--ok);color:var(--bg)}.cb.no{background:var(--err)}.cb.ac{background:rgba(255,255,255,.15)}
.cb.ac.on{background:var(--acc);color:var(--bg)}

.rec-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1500;display:none;align-items:center;justify-content:center;flex-direction:column}
.rec-ov.on{display:flex}
.rec-prev{width:220px;height:220px;border-radius:50%;overflow:hidden;border:4px solid var(--err);margin-bottom:16px}
.rec-prev video{width:100%;height:100%;object-fit:cover}
.rec-t{font-size:22px;font-weight:700;color:var(--err);margin-bottom:12px}

.fv{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2500;display:none;align-items:center;justify-content:center}
.fv.on{display:flex}
.fv img,.fv video{max-width:92vw;max-height:92vh;border-radius:8px}
.fvc{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:16px;cursor:pointer}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.a-spin{animation:spin 3s linear infinite}
.a-pulse{animation:pulse 2s ease-in-out infinite}
.a-bounce{animation:bounce 1.5s ease-in-out infinite}

@media(max-width:768px){
.side{width:100%;position:absolute;z-index:50}
.app.cm .side{display:none}
.app.cm .main{width:100%}
.mw{max-width:85%}
}
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth" id="auth">
<div class="auth-box">
<div class="logo">🍉</div>
<h1>Kavun</h1>
<p style="color:var(--txt2);font-size:13px;margin-bottom:4px">Сочный мессенджер</p>
<div class="tabs">
<button class="tab on" id="tLogin" onclick="swAuth('login')">Вход</button>
<button class="tab" id="tReg" onclick="swAuth('register')">Регистрация</button>
</div>
<form onsubmit="doAuth(event)">
<div class="reg" id="regF">
<div class="av-up"><label id="avL"><i class="fas fa-camera"></i></label><input type="file" id="avIn" accept="image/*" style="display:none"></div>
<div class="ig"><input id="rName" placeholder="Имя"><i class="fas fa-font"></i></div>
<div class="ig"><input id="rUser" placeholder="Юзернейм (латиница)"><i class="fas fa-at"></i></div>
</div>
<div class="ig"><input type="email" id="email" placeholder="Email" required><i class="fas fa-envelope"></i></div>
<div class="ig"><input type="password" id="pass" placeholder="Пароль (мин 6)" required minlength="6"><i class="fas fa-lock"></i></div>
<button class="btn" id="authB">Войти</button>
<div class="err" id="aErr"></div>
</form>
</div>
</div>

<!-- APP -->
<div class="app" id="app">
<div class="side" id="side">
<div class="side-h">
<h2>🍉 Kavun</h2>
<div style="display:flex;gap:5px">
<button class="ib" onclick="openSearch()" title="Найти"><i class="fas fa-search"></i></button>
<button class="ib" onclick="openFolders()" title="Папки"><i class="fas fa-folder-plus"></i></button>
<button class="ib" onclick="openSettings()" title="Настройки"><i class="fas fa-cog"></i></button>
<button class="ib" onclick="logout()" title="Выйти"><i class="fas fa-sign-out-alt"></i></button>
</div>
</div>
<div class="tbar" id="tbar"></div>
<div class="clist" id="clist"></div>
</div>

<div class="main" id="main">
<div id="empty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut)">
<div style="font-size:64px;margin-bottom:12px">🍉</div>
<h3>Выберите чат</h3>
</div>
<div id="chat" style="display:none;flex:1;flex-direction:column;min-height:0">
<div class="ch">
<div class="chi" onclick="viewProfile()">
<button class="ib" id="backB" style="display:none" onclick="event.stopPropagation();closeMobile()"><i class="fas fa-arrow-left"></i></button>
<div class="ca" id="hAv">U</div>
<div style="min-width:0">
<div style="font-weight:600" id="hName">User</div>
<div style="font-size:12px;color:var(--acc)" id="hSt">онлайн</div>
</div>
</div>
<div style="display:flex;gap:5px">
<button class="ib" onclick="showStats()" title="Статистика"><i class="fas fa-chart-bar"></i></button>
<button class="ib" onclick="startCall('audio')" title="Звонок"><i class="fas fa-phone"></i></button>
<button class="ib" onclick="startCall('video')" title="Видео"><i class="fas fa-video"></i></button>
<button class="ib" onclick="delChat()" title="Удалить" style="color:var(--err)"><i class="fas fa-trash"></i></button>
</div>
</div>
<div class="msgs" id="msgs"></div>
<div class="ia">
<div class="ibar">
<div class="pm" id="attM">
<button onclick="pickFile('image')"><i class="fas fa-image"></i> Фото</button>
<button onclick="pickFile('video')"><i class="fas fa-video"></i> Видео</button>
<button onclick="startCircle()"><i class="fas fa-circle" style="color:var(--err)"></i> Кружок</button>
</div>
<button class="ab" onclick="togAtt()"><i class="fas fa-paperclip"></i></button>
<button class="ab" id="vBtn" onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()"><i class="fas fa-microphone"></i></button>
<textarea class="it" id="inp" placeholder="Сообщение..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
<button class="sb" onclick="send()"><i class="fas fa-paper-plane"></i></button>
</div>
<input type="file" id="fIn" style="display:none" onchange="onFile(this)">
</div>
</div>
</div>
</div>

<!-- SEARCH -->
<div class="ov" id="searchOv">
<div class="md">
<h3>🔍 Найти</h3>
<div class="ig"><input id="sQ" placeholder="@юзернейм / имя / email" oninput="doSearch(this.value)"><i class="fas fa-search"></i></div>
<div id="sRes" style="max-height:320px;overflow-y:auto;margin:10px 0"></div>
<button class="bc" style="width:100%" onclick="closeM('searchOv')">Закрыть</button>
</div>
</div>

<!-- SETTINGS -->
<div class="ov" id="setOv">
<div class="md">
<h3>⚙️ Настройки</h3>
<div class="ss">
<h4>👤 Профиль</h4>
<div class="av-up"><label id="eAvL"><i class="fas fa-camera"></i></label><input type="file" id="eAvIn" accept="image/*" style="display:none"></div>
<div class="ig"><input id="eName" placeholder="Имя"><i class="fas fa-font"></i></div>
<div class="ig"><input id="eUser" placeholder="Юзернейм"><i class="fas fa-at"></i></div>
<div class="ig"><input id="eBio" placeholder="О себе"><i class="fas fa-info"></i></div>
</div>
<div class="ss">
<h4>🎭 Анимация аватарки</h4>
<select id="animS" onchange="saveAnim(this.value)" style="width:100%;padding:10px;background:var(--bg3);border:1px solid var(--brd);border-radius:8px;color:var(--txt)">
<option value="none">Нет</option>
<option value="spin">Кручение</option>
<option value="pulse">Пульсация</option>
<option value="bounce">Прыжок</option>
</select>
</div>
<div class="ss">
<h4>🎨 Тема</h4>
<div class="tg">
<div class="to" data-t="watermelon" onclick="setTheme('watermelon')"><div class="tp" style="background:linear-gradient(135deg,#27ae60,#e74c3c)"></div><p style="font-size:11px">🍉</p></div>
<div class="to" data-t="ocean" onclick="setTheme('ocean')"><div class="tp" style="background:linear-gradient(135deg,#2980b9,#9b59b6)"></div><p style="font-size:11px">🌊</p></div>
<div class="to" data-t="dark" onclick="setTheme('dark')"><div class="tp" style="background:linear-gradient(135deg,#000,#333)"></div><p style="font-size:11px">⚫</p></div>

function compress(file,max=500,q=.55){return new Promise(r=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);r(c.toDataURL('image/jpeg',q))};img.src=e.target.result};rd.readAsDataURL(file)})}
function toB64(file){return new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(file)})}

let mode='login';

async function doAuth(e){
e.preventDefault();const email=$('email').value.trim(),pass=$('pass').value,err=$('aErr');err.textContent='⏳...';
try{
if(mode==='register'){
const name=$('rName').value.trim()||'User';
let un=$('rUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
if(!un||un.length<3)throw new Error('Юзернейм от 3 символов (латиница)');
const ex=await db.collection('users').where('username','==',un).get();
if(!ex.empty)throw new Error('Юзернейм занят');
const cred=await auth.createUserWithEmailAndPassword(email,pass);
let av='';const f=$('avIn').files[0];if(f)av=await compress(f,200);
await db.collection('users').doc(cred.user.uid).set({name,username:un,email,avatar:av,bio:'',online:true,folders:[],avatarAnim:'none',contacts:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});
}else{await auth.signInWithEmailAndPassword(email,pass)}
err.textContent='';
}catch(ex){err.textContent=ex.message}
}

me=null;$('auth').classList.remove('hide');$('app').classList.remove('on');
}
});

async function drawChats(){
const list=$('clist');list.innerHTML='';
// Избранное
const sid=cid(me.uid,me.uid);
const sav=document.createElement('div');sav.className=`ci ${chatId===sid?'on':''}`;
sav.onclick=()=>openChat(sid,me.uid,{name:'🍉 Избранное',online:true,avatar:''},{});
sav.innerHTML=`<div class="ca" style="background:var(--acc)"><i class="fas fa-bookmark"></i></div><div style="flex:1;font-weight:600">Избранное</div>`;
list.appendChild(sav);

let list2=chats.filter(c=>!(c.deletedBy||[]).includes(me.uid));
if(tab==='direct')list2=list2.filter(c=>!c.isChannel);
if(tab.startsWith('f')){const i=+tab.slice(1);const ids=(meD.folders[i]||{}).chats||[];list2=list2.filter(c=>ids.includes(c.id))}
list2.sort((a,b)=>(b.lastMessageTime?.seconds||0)-(a.lastMessageTime?.seconds||0));

for(const c of list2){
let u={name:'?',avatar:'',online:false,avatarAnim:'none'};let oid=null;
if(c.isChannel)u={name:c.name,avatar:c.avatar};
else{oid=c.participants.find(p=>p!==me.uid);const f=users.find(x=>x.id===oid);if(f)u=f;else{try{const d=await db.collection('users').doc(oid).get();if(d.exists)u={id:oid,...d.data()}}catch(e){}}}
const un=c.unread&&c.unread[me.uid]?c.unread[me.uid]:0;
const anim=u.avatarAnim&&u.avatarAnim!=='none'?' a-'+u.avatarAnim:'';
const d=document.createElement('div');d.className=`ci ${c.id===chatId?'on':''}`;
d.onclick=()=>openChat(c.id,oid,u,c);
d.innerHTML=`<div class="ca${anim}">${u.avatar?`<img src="${u.avatar}">`:(u.name||'?')[0]}${u.online?'<div class="dot"></div>':''}</div>
<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${c.isChannel?'📢 ':''}${esc(u.name)}</div>
<div style="font-size:12px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.lastMessage||'')}</div></div>
${un>0?`<div class="ub">${un}</div>`:''}`;
list.appendChild(d);
}
}

async function startChat(uid){
const id=cid(me.uid,uid);const ref=db.collection('chats').doc(id);const d=await ref.get();
if(!d.exists)await ref.set({participants:[me.uid,uid],lastMessage:'',lastMessageTime:firebase.firestore.FieldValue.serverTimestamp(),deletedBy:[],unread:{}});
else await ref.update({deletedBy:firebase.firestore.FieldValue.arrayRemove(me.uid)});
closeM('profOv');closeM('searchOv');
const u=users.find(x=>x.id===uid)||{name:'?'};
openChat(id,uid,u,{});
}

function openChat(id,oid,u,cd){
chatId=id;chatU={uid:oid,...u};chatD=cd||{};
$('empty').style.display='none';$('chat').style.display='flex';
$('hName').textContent=u.name;
$('hAv').innerHTML=u.avatar?`<img src="${u.avatar}">`:(u.name||'?')[0];
$('hSt').textContent=u.online?'🟢 онлайн':'был(а) недавно';
$('msgs').innerHTML='';
if(window.innerWidth<=768){$('app').classList.add('cm');$('backB').style.display='flex'}
db.collection('chats').doc(id).update({[`unread.${me.uid}`]:0}).catch(()=>{});
if(unMsg)unMsg();
unMsg=db.collection('chats').doc(id).collection('messages').orderBy('timestamp').onSnapshot(s=>{
const cont=$('msgs');cont.innerHTML='';msgs=[];
s.docs.forEach(doc=>{
const m={id:doc.id,...doc.data()};
if((m.deletedFor||[]).includes(me.uid))return;
msgs.push(m);
const sent=m.sender===me.uid;
if(!sent&&document.hidden){try{new Notification(chatU.name,{body:m.text||'📎'})}catch(e){}}
if(!sent&&!(m.readBy||[]).includes(me.uid)){
db.collection('chats').doc(id).collection('messages').doc(m.id).update({readBy:firebase.firestore.FieldValue.arrayUnion(me.uid)}).catch(()=>{});
}
cont.appendChild(mkMsg(m,sent));
});
cont.scrollTop=cont.scrollHeight;
});
}

function mkMsg(m,sent){
const d=document.createElement('div');
if(m.type==='call_missed'||m.type==='call_ended'){
d.className='mw sys';d.id='msg-'+m.id;
const t=m.type==='call_missed'?'📞 Пропущенный звонок':'📞 Звонок завершён';
const dur=m.duration?` (${Math.floor(m.duration/60)}:${String(m.duration%60).padStart(2,'0')})`:'';
d.innerHTML=`<div class="m">${t}${dur}</div>`;return d;
}
d.className=`mw ${sent?'s':'r'}`;d.id='msg-'+m.id;
let h='';
if(m.replyTo)h+=`<div class="rp"><div class="n">${esc(m.replyTo.name)}</div><div>${esc(m.replyTo.text||'📎')}</div></div>`;
let c='';
if(m.type==='image')c=`<div class="mm"><img src="${m.media}" onclick="openFv('${m.media}','image')"></div>`;
else if(m.type==='video')c=`<div class="mm"><video src="${m.media}" controls></video></div>`;
else if(m.type==='circle')c=`<div class="vc" onclick="let v=this.querySelector('video');v.paused?v.play():v.pause()"><video src="${m.media}" loop></video></div>`;
else if(m.type==='voice')c=`<div class="vm"><button onclick="playV(this,'${m.media}')"><i class="fas fa-play"></i></button><div style="flex:1;height:18px;background:repeating-linear-gradient(90deg,currentColor 0,currentColor 2px,transparent 2px,transparent 5px);opacity:.4"></div><span>${m.duration||0}s</span></div>`;
else if(m.type==='sticker')c=m.stickerData&&m.stickerData.startsWith('data:')?`<div class="st"><img src="${m.stickerData}"></div>`:`<div class="st">${m.stickerData}</div>`;
if(m.text)c+=`<div>${esc(m.text)}</div>`;
h+=`<div class="m">${c||'[ ]'}</div>`;
if(m.reactions){
const rc={};Object.entries(m.reactions).forEach(([u,e])=>{if(!rc[e])rc[e]={c:0,a:false};rc[e].c++;if(u===me.uid)rc[e].a=true});
h+=`<div class="reacts">${Object.entries(rc).map(([e,x])=>`<div class="re ${x.a?'on':''}" onclick="react('${m.id}','${e}')">${e} ${x.c}</div>`).join('')}</div>`;
}
const tm=m.timestamp?m.timestamp.toDate().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
let ch='';if(sent&&chatU.uid!==me.uid){const rd=(m.readBy||[]).includes(chatU.uid);ch=rd?'<span class="checks">✓✓</span>':'<span class="checks" style="color:var(--mut)">✓</span>'}
h+=`<div class="mt">${ch}<span>${tm}</span></div>`;
h+=`<div class="ma">
<button onclick="setRep('${m.id}','${esc(m.text||'📎').slice(0,40)}','${esc(sent?meD.name:chatU.name)}')"><i class="fas fa-reply"></i></button>
<button onclick="react('${m.id}','❤️')">❤️</button>
<button onclick="react('${m.id}','👍')">👍</button>
<button onclick="react('${m.id}','😂')">😂</button>
${sent&&m.type==='text'?`<button onclick="editM('${m.id}','${esc(m.text||'')}')"><i class="fas fa-edit"></i></button>`:''}
<button onclick="delM('${m.id}',${sent})"><i class="fas fa-trash"></i></button>
</div>`;
d.innerHTML=h;return d;
}

function setRep(id,t,n){reply={id,text:t,name:n};$('inp').focus()}
async function react(id,e){
const ref=db.collection('chats').doc(chatId).collection('messages').doc(id);
const d=await ref.get();const r=(d.data().reactions)||{};
if(r[me.uid]===e)await ref.update({[`reactions.${me.uid}`]:firebase.firestore.FieldValue.delete()});
else await ref.update({[`reactions.${me.uid}`]:e});
}
async function editM(id,old){const n=prompt('Изменить:',old);if(n!==null&&n.trim()&&n!==old)await db.collection('chats').doc(chatId).collection('messages').doc(id).update({text:n.trim(),edited:true})}
async function delM(id,mine){
const c=prompt(mine?'1=у всех, 2=у меня, 0=отмена':'1=у меня, 0=отмена');
if(c==='1'&&mine)await db.collection('chats').doc(chatId).collection('messages').doc(id).delete();
else if(c==='1'||c==='2')await db.collection('chats').doc(chatId).collection('messages').doc(id).update({deletedFor:firebase.firestore.FieldValue.arrayUnion(me.uid)});
}

async function send(){
const t=$('inp').value.trim();if(!t||!chatId)return;$('inp').value='';
const data={sender:me.uid,text:t,type:'text',timestamp:firebase.firestore.FieldValue.serverTimestamp(),readBy:[me.uid]};
if(reply)data.replyTo=reply;
await db.collection('chats').doc(chatId).collection('messages').add(data);
await updMeta(t);reply=null;
}
async function updMeta(p){
const u={lastMessage:p,lastMessageTime:firebase.firestore.FieldValue.serverTimestamp(),deletedBy:[]};
if(chatU.uid!==me.uid)u[`unread.${chatU.uid}`]=firebase.firestore.FieldValue.increment(1);
await db.collection('chats').doc(chatId).update(u);
}
async function delChat(){if(!chatId||!confirm('Удалить чат?'))return;await db.collection('chats').doc(chatId).update({deletedBy:firebase.firestore.FieldValue.arrayUnion(me.uid)});$('chat').style.display='none';$('empty').style.display='flex';chatId=null}

function showStats(){
$('stAll').textContent=msgs.length;
$('stMy').textContent=msgs.filter(m=>m.sender===me.uid).length;
$('statOv').classList.add('on');
}

/* FILES / CIRCLE / VOICE */
function togAtt(){$('attM').classList.toggle('show')}
let fType='image';
function pickFile(t){fType=t;const i=$('fIn');i.accept=t==='image'?'image/*':'video/*';i.click();$('attM').classList.remove('show')}
async function onFile(inp){
const f=inp.files[0];if(!f)return;
try{
let media,type=fType;
if(type==='image')media=await compress(f,800,.6);
else media=await toB64(f);
await db.collection('chats').doc(chatId).collection('messages').add({sender:me.uid,text:'',type,media,timestamp:firebase.firestore.FieldValue.serverTimestamp(),readBy:[me.uid]});
await updMeta(type==='image'?'📷 Фото':'🎥 Видео');
}catch(e){
if(e.message&&e.message.includes('longer than'))alert('Файл слишком большой для Firestore (лимит ~1МБ). Сожмите файл.');
else alert('Ошибка: '+e.message);
}
inp.value='';
}

/* CIRCLES — FIXED */
async function startCircle(){
$('attM').classList.remove('show');
try{
const stream=await navigator.mediaDevices.getUserMedia({video:{width:240,height:240,facingMode:'user'},audio:true});
$('circV').srcObject=stream;$('circOv').classList.add('on');
circC=[];circR=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm'});
circR.ondataavailable=e=>{if(e.data.size>0)circC.push(e.data)};
circR.start(100);circT0=Date.now();
circTmr=setInterval(()=>{
const s=Math.floor((Date.now()-circT0)/1000);
$('circT').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
if(s>=10)stopCirc(true);
},400);
}catch(e){alert('Нет доступа к камере: '+e.message)}
}
async function stopCirc(send){
clearInterval(circTmr);$('circT').textContent='00:00';
const stream=$('circV').srcObject;if(stream)stream.getTracks().forEach(t=>t.stop());
$('circV').srcObject=null;$('circOv').classList.remove('on');
if(!send||!circR||circR.state==='inactive'){if(circR&&circR.state!=='inactive')circR.stop();return}
circR.onstop=async()=>{
const blob=new Blob(circC,{type:'video/webm'});
if(blob.size>900*1024){alert('Кружок слишком большой, попробуйте короче');return}
const media=await toB64(blob);
try{
await db.collection('chats').doc(chatId).collection('messages').add({sender:me.uid,text:'',type:'circle',media,timestamp:firebase.firestore.FieldValue.serverTimestamp(),readBy:[me.uid]});
await updMeta('⭕ Кружок');
}catch(e){alert('Ошибка отправки кружка: '+e.message)}
};
circR.stop();
}

/* VOICE */
async function startVoice(){
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
voiceR=new MediaRecorder(stream);voiceC=[];voiceT=Date.now();
voiceR.ondataavailable=e=>voiceC.push(e.data);
voiceR.onstop=async()=>{
stream.getTracks().forEach(t=>t.stop());
const dur=Math.round((Date.now()-voiceT)/1000);if(dur<1)return;
const blob=new Blob(voiceC,{type:'audio/webm'});
const media=await toB64(blob);
await db.collection('chats').doc(chatId).collection('messages').add({sender:me.uid,text:'',type:'voice',media,duration:dur,timestamp:firebase.firestore.FieldValue.serverTimestamp(),readBy:[me.uid]});
await updMeta('🎤 Голосовое');
};
voiceR.start();$('vBtn').style.background='var(--err)';
}catch(e){}
}
function stopVoice(){if(voiceR&&voiceR.state!=='inactive'){voiceR.stop();$('vBtn').style.background=''}}
function playV(btn,src){const a=new Audio(src);a.play();btn.innerHTML='<i class="fas fa-pause"></i>';a.onended=()=>btn.innerHTML='<i class="fas fa-play"></i>'}

function openFv(src,type){$('fvC').innerHTML=type==='image'?`<img src="${src}">`:`<video src="${src}" controls autoplay></video>`;$('fv').classList.add('on')}
function closeFv(){$('fv').classList.remove('on');$('fvC').innerHTML=''}

/* CALLS */
function listenCalls(){
if(unCall)unCall();
unCall=db.collection('calls').where('participants','array-contains',me.uid).onSnapshot(s=>{
s.docChanges().forEach(ch=>{
const c={id:ch.doc.id,...ch.doc.data()};
if(ch.type==='added'&&c.callerId!==me.uid&&!(c.acceptedBy||[]).includes(me.uid)){
callId=c.id;$('inName').textContent=c.callerName;$('inSt').textContent=c.type==='video'?'📹 Видео':'📞 Аудио';
$('inCall').classList.add('on');
setTimeout(async()=>{if(callId===c.id&&$('inCall').classList.contains('on')){await addCallMsg(c.chatId||cid(me.uid,c.callerId),'call_missed',0);rejectCall()}},30000);
}
if(ch.type==='removed'&&c.id===callId)endCall();
});
});
}
async function addCallMsg(cid_,type,dur){
try{
await db.collection('chats').doc(cid_).collection('messages').add({sender:me.uid,type,duration:dur,timestamp:firebase.firestore.FieldValue.serverTimestamp(),readBy:[me.uid]});
await db.collection('chats').doc(cid_).update({lastMessage:type==='call_missed'?'📞 Пропущенный':'📞 Звонок',lastMessageTime:firebase.firestore.FieldValue.serverTimestamp()});
}catch(e){}
}

async function startCall(type){
if(!chatU||chatU.uid===me.uid)return alert('Нельзя');
try{
camOff=type!=='video';
localS=await navigator.mediaDevices.getUserMedia({audio:true,video:true});
if(camOff)localS.getVideoTracks().forEach(t=>t.enabled=false);
callDoc=db.collection('calls').doc();callId=callDoc.id;callT0=Date.now();
await callDoc.set({callerId:me.uid,callerName:meD.name,participants:[me.uid,chatU.uid],chatId:chatId,acceptedBy:[me.uid],type,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
showCallUI();addVid('local',localS,meD.name,true);updCamBtn();
await setupPC(chatU.uid,true);
}catch(e){alert('Ошибка: '+e.message);endCall()}
}
async function acceptCall(){
$('inCall').classList.remove('on');
try{
callDoc=db.collection('calls').doc(callId);const data=(await callDoc.get()).data();
camOff=data.type!=='video';callT0=Date.now();
localS=await navigator.mediaDevices.getUserMedia({audio:true,video:true});
if(camOff)localS.getVideoTracks().forEach(t=>t.enabled=false);
await callDoc.update({acceptedBy:firebase.firestore.FieldValue.arrayUnion(me.uid)});
showCallUI();addVid('local',localS,meD.name,true);updCamBtn();
await setupPC(data.callerId,false);
}catch(e){alert(e.message);endCall()}
}
async function setupPC(rid,offer){
const p=new RTCPeerConnection(stun);pc[rid]=p;
localS.getTracks().forEach(t=>p.addTrack(t,localS));
const rs=new MediaStream();p.ontrack=e=>e.streams[0].getTracks().forEach(t=>rs.addTrack(t));
addVid(rid,rs,chatU?.name||'?',false);
const col=callDoc.collection(offer?'c_off':'c_ans').doc(rid).collection('l');
p.onicecandidate=e=>{if(e.candidate)col.add(e.candidate.toJSON())};
if(offer){
const o=await p.createOffer();await p.setLocalDescription(o);
await callDoc.collection('offers').doc(rid).set({sdp:o.sdp,type:o.type});
callUn.push(callDoc.collection('answers').doc(me.uid).onSnapshot(async s=>{if(s.exists&&!p.currentRemoteDescription)await p.setRemoteDescription(new RTCSessionDescription(s.data()))}));
callUn.push(callDoc.collection('c_ans').doc(me.uid).collection('l').onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type==='added')p.addIceCandidate(new RTCIceCandidate(c.doc.data()))})));
}else{
callUn.push(callDoc.collection('offers').doc(me.uid).onSnapshot(async s=>{if(s.exists&&!p.currentRemoteDescription){await p.setRemoteDescription(new RTCSessionDescription(s.data()));const a=await p.createAnswer();await p.setLocalDescription(a);await callDoc.collection('answers').doc(rid).set({sdp:a.sdp,type:a.type})}}));
callUn.push(callDoc.collection('c_off').doc(rid).collection('l').onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type==='added')p.addIceCandidate(new RTCIceCandidate(c.doc.data()))})));
}
}
function showCallUI(){$('actCall').classList.add('on');$('vGrid').innerHTML=''}
function addVid(id,stream,name,loc){
const g=$('vGrid');const old=$('v-'+id);if(old)old.remove();
const d=document.createElement('div');d.className=`vi ${loc?'loc':''}`;d.id='v-'+id;
d.innerHTML=`<video autoplay playsinline ${loc?'muted':''}></video><div class="nt">${esc(name)}</div>`;
g.appendChild(d);d.querySelector('video').srcObject=stream;
const n=g.children.length;g.className=`vg g${Math.min(n,2)}`;
}
function updCamBtn(){const b=$('camB');if(camOff){b.innerHTML='<i class="fas fa-video-slash"></i>';b.classList.remove('on')}else{b.innerHTML='<i class="fas fa-video"></i>';b.classList.add('on')}}
function rejectCall(){if(callId)db.collection('calls').doc(callId).delete().catch(()=>{});endCall()}
async function endCall(){
$('inCall').classList.remove('on');$('actCall').classList.remove('on');
if(callT0&&callId){try{const d=(await db.collection('calls').doc(callId).get()).data();if(d&&d.chatId)await addCallMsg(d.chatId,'call_ended',Math.floor((Date.now()-callT0)/1000))}catch(e){}}
if(callId)db.collection('calls').doc(callId).delete().catch(()=>{});
callId=null;callT0=null;callUn.forEach(u=>u&&u());callUn=[];
Object.values(pc).forEach(p=>p.close());pc={};
if(localS){localS.getTracks().forEach(t=>t.stop());localS=null}
$('vGrid').innerHTML='';
}
function togMic(){if(!localS)return;const t=localS.getAudioTracks()[0];if(t){t.enabled=!t.enabled;const b=$('micB');b.style.background=t.enabled?'rgba(255,255,255,.15)':'var(--err)';b.innerHTML=t.enabled?'<i class="fas fa-microphone"></i>':'<i class="fas fa-microphone-slash"></i>'}}
async function togCam(){
if(!localS)return;
let vt=localS.getVideoTracks()[0];
if(!vt){try{const vs=await navigator.mediaDevices.getUserMedia({video:true});vt=vs.getVideoTracks()[0];localS.addTrack(vt);Object.values(pc).forEach(p=>p.addTrack(vt,localS));camOff=false}catch(e){alert(e.message);return}}
else{vt.enabled=!vt.enabled;camOff=!vt.enabled}
updCamBtn();
}
let origVT=null;
async function shareScr(){
if(!Object.keys(pc).length)return alert('Только в звонке');
try{
if(origVT){Object.values(pc).forEach(p=>{const s=p.getSenders().find(x=>x.track&&x.track.kind==='video');if(s)s.replaceTrack(origVT)});const lv=document.querySelector('#v-local video');if(lv)lv.srcObject=localS;$('scrB').classList.remove('on');origVT=null}
else{const scr=await navigator.mediaDevices.getDisplayMedia({video:true});const st=scr.getVideoTracks()[0];Object.values(pc).forEach(p=>{const s=p.getSenders().find(x=>x.track&&x.track.kind==='video');if(s){if(!origVT)origVT=s.track;s.replaceTrack(st)}});const lv=document.querySelector('#v-local video');if(lv)lv.srcObject=scr;$('scrB').classList.add('on');st.onended=()=>shareScr()}
}catch(e){alert(e.message)}
}

document.addEventListener('click',e=>{if(!e.target.closest('.ab')&&!e.target.closest('.pm'))$('attM').classList.remove('show')});
window.addEventListener('beforeunload',()=>{if(me)db.collection('users').doc(me.uid).update({online:false}).catch(()=>{})});
</script>
</body>
</html>
