<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavun — Мессенджер</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1712;
            --bg-secondary: #16221a;
            --bg-tertiary: #1f3024;
            --bg-hover: #2a4030;
            --accent: #2ecc71;
            --accent-light: #58d68d;
            --text-primary: #e8f0ea;
            --text-secondary: #88a896;
            --text-muted: #557061;
            --border: #2a4030;
            --success: #2ecc71;
            --danger: #e74c3c;
            --message-out: #27ae60;
            --message-in: #1f3024;
            --gradient-1: linear-gradient(135deg, #27ae60, #2ecc71);
            --gradient-2: linear-gradient(135deg, #e74c3c, #ff7979);
            --shadow-1: 0 4px 15px rgba(46, 204, 113, 0.3);
            --shadow-2: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); height:100vh; overflow:hidden; }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }

        /* Auth */
        .auth-screen { position:fixed; inset:0; background:var(--bg-primary); display:flex; align-items:center; justify-content:center; z-index:1000; transition:opacity .5s,visibility .5s; }
        .auth-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .auth-container { width:400px; max-width:95vw; padding:40px 30px; background:var(--bg-secondary); border-radius:24px; border:1px solid var(--border); box-shadow:var(--shadow-2); text-align:center; }
        .auth-logo { width:70px; height:70px; background:var(--gradient-2); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px; box-shadow:var(--shadow-1); }
        .auth-container h1 { font-size:26px; font-weight:700; margin-bottom:6px; background:var(--gradient-1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .auth-container p { color:var(--text-secondary); margin-bottom:24px; font-size:14px; }
        .auth-tabs { display:flex; gap:4px; background:var(--bg-tertiary); border-radius:var(--radius-sm); padding:4px; margin-bottom:24px; }
        .auth-tab { flex:1; padding:10px; border:none; background:transparent; color:var(--text-secondary); cursor:pointer; border-radius:8px; font-weight:500; font-size:14px; transition:all .3s; }
        .auth-tab.active { background:var(--accent); color:var(--bg-primary); font-weight:700;}
        .input-group { position:relative; margin-bottom:14px; }
        .input-group i { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px; }
        .input-group input { width:100%; padding:12px 16px 12px 44px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-primary); font-size:14px; outline:none; }
        .auth-btn { width:100%; padding:12px; background:var(--gradient-1); border:none; border-radius:var(--radius-sm); color:var(--bg-primary); font-size:15px; font-weight:700; cursor:pointer; }
        .auth-error { color:var(--danger); font-size:13px; margin-top:12px; min-height:20px; }
        .avatar-upload label { width:65px; height:65px; border-radius:50%; background:var(--bg-tertiary); border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; cursor:pointer; overflow:hidden; }
        .avatar-upload label img { width:100%; height:100%; object-fit:cover; }
        .register-fields { display:none; } .register-fields.active { display:block; }

        /* App Layout */
        .app { display:flex; height:100vh; opacity:0; visibility:hidden; transition:opacity .5s; }
        .app.visible { opacity:1; visibility:visible; }
        .sidebar { width:350px; background:var(--bg-secondary); border-right:1px solid var(--border); display:flex; flex-direction:column; }
        .sidebar-header { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
        .sidebar-header h2 { font-size:22px; font-weight:700; background:var(--gradient-2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .icon-btn { width:38px; height:38px; border-radius:50%; border:none; background:var(--bg-tertiary); color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .3s; }
        .icon-btn:hover { background:var(--accent); color:var(--bg-primary); }
        .icon-btn.danger:hover { background:var(--danger); color:white; }
        
        .search-box { padding:12px 20px; position:relative; }
        .search-box input { width:100%; padding:10px 16px 10px 40px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:25px; color:var(--text-primary); font-size:13px; outline:none; }
        .search-box i { position:absolute; left:36px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:13px; }
        
        .chat-list { flex:1; overflow-y:auto; padding:8px; }
        .chat-item { display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--radius-sm); cursor:pointer; }
        .chat-item:hover { background:var(--bg-hover); }
        .chat-item.active { background:var(--bg-tertiary); border:1px solid var(--border); }
        .chat-avatar { width:48px; height:48px; border-radius:50%; background:var(--gradient-1); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:18px; color:var(--bg-primary); overflow:hidden; position:relative;flex-shrink:0;}
        .chat-avatar img { width:100%; height:100%; object-fit:cover; }
        .online-dot { width:12px; height:12px; background:var(--success); border:2px solid var(--bg-secondary); border-radius:50%; position:absolute; bottom:0; right:0; }
        .unread-badge { min-width:20px; height:20px; background:var(--danger); border-radius:10px; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 6px; color:white;}

        /* Chat Area */
        .chat-area { flex:1; display:flex; flex-direction:column; background:var(--bg-primary); }
        .chat-header { padding:12px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); background:var(--bg-secondary); }
        .messages-container { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:4px; }
        .message-wrapper { display:flex; flex-direction:column; max-width:70%; }
        .message-wrapper.sent { align-self:flex-end; } .message-wrapper.received { align-self:flex-start; }
        .message { padding:10px 16px; border-radius:18px; font-size:14px; line-height:1.5; word-wrap:break-word; }
        .message-wrapper.sent .message { background:var(--message-out); border-bottom-right-radius:6px; color:var(--bg-primary); font-weight:500;}
        .message-wrapper.received .message { background:var(--message-in); border-bottom-left-radius:6px; border:1px solid var(--border); }
        .message-time { font-size:10px; color:var(--text-muted); margin-top:4px; text-align:right; }
        
        .input-area { padding:16px 24px; border-top:1px solid var(--border); background:var(--bg-secondary); display:flex; gap:12px; align-items:flex-end; }
        .input-text { flex:1; padding:12px 16px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:24px; color:var(--text-primary); font-size:14px; outline:none; resize:none; max-height:120px; min-height:44px; }
        .send-btn { width:44px; height:44px; border-radius:50%; border:none; background:var(--gradient-1); color:var(--bg-primary); cursor:pointer; flex-shrink:0; }
        
        /* Modals */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:1100; display:none; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal { width:400px; background:var(--bg-secondary); border-radius:var(--radius); padding:28px; border:1px solid var(--border); }
        .modal h3 { font-size:18px; margin-bottom:16px; text-align:center; }
        .btn-cancel { flex:1; padding:12px; border:none; border-radius:var(--radius-sm); background:var(--bg-tertiary); color:var(--text-secondary); cursor:pointer; font-weight:600;}
        
        /* Call Screens */
        .call-screen { position:fixed; inset:0; background:rgba(15, 23, 18, 0.95); z-index:2000; display:none; flex-direction:column; align-items:center; justify-content:center; }
        .call-screen.active { display:flex; }
        .call-avatar-large { width:120px; height:120px; border-radius:50%; background:var(--gradient-1); display:flex; align-items:center; justify-content:center; font-size:48px; margin-bottom:24px; animation:call-pulse 1.5s infinite; overflow:hidden; }
        .call-avatar-large img { width:100%; height:100%; object-fit:cover; }
        @keyframes call-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(46, 204, 113,.5)} 50%{box-shadow:0 0 0 30px rgba(46, 204, 113,0)} }
        
        .video-call-container { position:fixed; inset:0; z-index:2000; background:#000; display:none; }
        .video-call-container.active { display:flex; }
        .remote-video { width:100%; height:100%; object-fit:cover; }
        .local-video { position:absolute; top:20px; right:20px; width:120px; height:160px; border-radius:var(--radius-sm); overflow:hidden; border:2px solid var(--accent); z-index:2010;}
        .local-video video { width:100%; height:100%; object-fit:cover; transform: scaleX(-1); }
        
        .call-controls { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:flex; gap:20px; z-index:2010;}
        .call-btn { width:60px; height:60px; border-radius:50%; border:none; cursor:pointer; font-size:22px; color:white; display:flex; align-items:center; justify-content:center;}
        .call-btn.accept { background:var(--success); color:var(--bg-primary);}
        .call-btn.reject { background:var(--danger); }
        .call-btn.action { background:var(--bg-tertiary); }
    </style>
</head>
<body>

<!-- ВХОД / РЕГА -->
<div class="auth-screen" id="authScreen">
    <div class="auth-container">
        <div class="auth-logo"><i class="fas fa-watermelon"></i> 🍉</div>
        <h1>Kavun</h1>
        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTabBtn" onclick="switchAuthTab('login')">Вход</button>
            <button class="auth-tab" id="registerTabBtn" onclick="switchAuthTab('register')">Регистрация</button>
        </div>
        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="register-fields" id="registerFields">
                <div class="avatar-upload">
                    <label for="avatarInput" id="avatarLabel"><i class="fas fa-camera"></i></label>
                    <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(this)">
                </div>
                <div class="input-group">
                    <input type="text" id="regName" placeholder="Ваше Имя (Например: Иван)">
                    <i class="fas fa-font"></i>
                </div>
                <div class="input-group">
                    <input type="text" id="regUsername" placeholder="Юзернейм (Например: ivan99)">
                    <i class="fas fa-at"></i>
                </div>
            </div>
            <div class="input-group">
                <input type="email" id="authEmail" placeholder="Email" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" id="authPassword" placeholder="Пароль" required minlength="6">
                <i class="fas fa-lock"></i>
            </div>
            <button type="submit" class="auth-btn" id="authBtn">Войти</button>
            <div class="auth-error" id="authError"></div>
        </form>
    </div>
</div>

<!-- ГЛАВНОЕ ПРИЛОЖЕНИЕ -->
<div class="app" id="app">
    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🍉 Kavun</h2>
            <div class="sidebar-actions">
                <button class="icon-btn" onclick="openNewChatModal()" title="Найти контакт"><i class="fas fa-search"></i></button>
                <button class="icon-btn" onclick="openProfileEditModal()" title="Мой профиль"><i class="fas fa-user-cog"></i></button>
                <button class="icon-btn" onclick="logout()" title="Выйти"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Поиск по вашим чатам..." oninput="filterChats(this.value)">
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- ЗОНА ЧАТА -->
    <div class="chat-area">
        <div id="chatEmpty" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted);">
            <i class="fas fa-seedling" style="font-size:60px; margin-bottom:20px; color:var(--accent);"></i>
            <h3>Выберите чат</h3>
        </div>
        
        <div id="chatContent" style="display:none; flex:1; flex-direction:column;">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="chat-avatar" id="chatHeaderAvatar">U</div>
                    <div>
                        <div style="font-weight:600;" id="chatHeaderName">User</div>
                        <div style="font-size:12px; color:var(--accent);" id="chatHeaderStatus">онлайн</div>
                    </div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="icon-btn" onclick="startWebRTCCall('audio')" title="Аудиозвонок"><i class="fas fa-phone"></i></button>
                    <button class="icon-btn" onclick="startWebRTCCall('video')" title="Видеозвонок"><i class="fas fa-video"></i></button>
                    <button class="icon-btn danger" onclick="deleteChat()" title="Удалить чат"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            
            <div class="input-area">
                <textarea class="input-text" id="messageInput" placeholder="Написать сообщение..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
                <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- МОДАЛКА: ПОИСК КОНТАКТА -->
<div class="modal-overlay" id="newChatModal">
    <div class="modal">
        <h3>🔍 Найти контакт</h3>
        <div class="input-group">
            <input type="text" id="findUserInput" placeholder="@username или Имя" oninput="searchUsersDB(this.value)">
            <i class="fas fa-search"></i>
        </div>
        <div id="userSearchResults" style="max-height:250px; overflow-y:auto; margin-bottom:15px;"></div>
        <div style="display:flex; gap:10px;">
            <button class="btn-cancel" style="width:100%;" onclick="document.getElementById('newChatModal').classList.remove('active')">Закрыть</button>
        </div>
    </div>
</div>

<!-- МОДАЛКА: РЕДАКТИРОВАНИЕ ПРОФИЛЯ -->
<div class="modal-overlay" id="profileEditModal">
    <div class="modal">
        <h3>Мой профиль</h3>
        <div class="avatar-upload">
            <label for="editAvatarInput" id="editAvatarLabel"><i class="fas fa-camera"></i></label>
            <input type="file" id="editAvatarInput" accept="image/*" onchange="previewEditAvatar(this)">
        </div>
        <div class="input-group">
            <input type="text" id="editProfileName" placeholder="Имя">
            <i class="fas fa-font"></i>
        </div>
        <div class="input-group">
            <input type="text" id="editProfileUsername" placeholder="Юзернейм">
            <i class="fas fa-at"></i>
        </div>
        <p id="editProfileError" style="color:var(--danger); font-size:13px; margin-bottom:10px;"></p>
        <div style="display:flex; gap:10px;">
            <button class="btn-cancel" onclick="document.getElementById('profileEditModal').classList.remove('active')">Отмена</button>
            <button class="auth-btn" style="flex:1; margin:0;" onclick="saveProfileChanges()">Сохранить</button>
        </div>
    </div>
</div>

<!-- ЗВОНКИ -->
<div class="call-screen" id="incomingCallScreen">
    <div class="call-avatar-large" id="incomingCallAvatar"><i class="fas fa-phone"></i></div>
    <h2 id="incomingCallName" style="margin-bottom:10px;">User</h2>
    <p id="incomingCallStatus" style="color:var(--accent); margin-bottom:40px;">Входящий видеозвонок...</p>
    <div class="call-controls">
        <button class="call-btn reject" onclick="rejectCall()"><i class="fas fa-phone-slash"></i></button>
        <button class="call-btn accept" onclick="acceptCall()"><i class="fas fa-phone"></i></button>
    </div>
</div>

<div class="video-call-container" id="activeCallScreen">
    <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
    <div class="local-video"><video id="localVideo" autoplay playsinline muted></video></div>
    <div class="call-controls">
        <button class="call-btn action" onclick="toggleMic()" id="micBtn"><i class="fas fa-microphone"></i></button>
        <button class="call-btn reject" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
        <button class="call-btn action" onclick="toggleCam()" id="camBtn"><i class="fas fa-video"></i></button>
    </div>
</div>

<!-- SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
// 1. КОНФИГ
const firebaseConfig = {
    apiKey: "AIzaSyBKiUSqJi_Ah1WiA8zbE3kv5LK34x0y6Wk",
    authDomain: "kavun-503cd.firebaseapp.com",
    projectId: "kavun-503cd",
    storageBucket: "kavun-503cd.firebasestorage.app",
    messagingSenderId: "381618417793",
    appId: "1:381618417793:web:a52ac7a726da6fd01add80"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentUserData = null;
let activeChatId = null;
let activeChatUser = null;
let unsubscribeMessages = null;

// Запрос уведомлений
if (Notification.permission !== "granted" && Notification.permission !== "denied") {
    Notification.requestPermission();
}
function sendPush(title, body) {
    if (Notification.permission === "granted" && document.hidden) {
        new Notification(title, { body, icon: '🍉' });
    }
}

// УТИЛИТЫ СЖАТИЯ ФОТО
function compressImage(file, maxSize = 300) {
    return new Promise(resolve => {
        const r = new FileReader();
        r.onload = e => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if(w>maxSize || h>maxSize){ if(w>h){h*=maxSize/w; w=maxSize;} else {w*=maxSize/h; h=maxSize;} }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img,0,0,w,h);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = e.target.result;
        };
        r.readAsDataURL(file);
    });
}

// ==========================================
// АВТОРИЗАЦИЯ
// ==========================================
let authMode = 'login';
function switchAuthTab(mode) {
    authMode = mode;
    document.getElementById('loginTabBtn').classList.toggle('active', mode==='login');
    document.getElementById('registerTabBtn').classList.toggle('active', mode==='register');
    document.getElementById('registerFields').classList.toggle('active', mode==='register');
    document.getElementById('authBtn').textContent = mode==='login' ? 'Войти' : 'Создать аккаунт';
    document.getElementById('authError').textContent = '';
}

function previewAvatar(input) {
    if(input.files[0]) {
        const r = new FileReader();
        r.onload = e => document.getElementById('avatarLabel').innerHTML = `<img src="${e.target.result}">`;
        r.readAsDataURL(input.files[0]);
    }
}

async function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = 'Обработка...';

    try {
        if (authMode === 'register') {
            const name = document.getElementById('regName').value.trim() || 'Пользователь';
            let username = document.getElementById('regUsername').value.trim().toLowerCase().replace(/@/g, '');
            if (!username) username = 'id' + Date.now();

            const snap = await db.collection('users').where('username', '==', username).get();
            if (!snap.empty) throw new Error('Юзернейм уже занят!');

            const cred = await auth.createUserWithEmailAndPassword(email, password);
            let avatar = '';
            const file = document.getElementById('avatarInput').files[0];
            if (file) avatar = await compressImage(file, 200);

            await db.collection('users').doc(cred.user.uid).set({ name, username, email, avatar, online: true });
        } else {
            await auth.signInWithEmailAndPassword(email, password);
        }
    } catch (err) { errEl.textContent = err.message.includes('Юзернейм') ? err.message : 'Ошибка входа.'; }
}

auth.onAuthStateChanged(async user => {
    if (user) {
        currentUser = user;
        const doc = await db.collection('users').doc(user.uid).get();
        currentUserData = doc.data();
        await db.collection('users').doc(user.uid).update({ online: true });
        
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('app').classList.add('visible');
        loadChats();
        listenForIncomingCalls();
    } else {
        currentUser = null;
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('app').classList.remove('visible');
    }
});

function logout() { auth.signOut(); }

// ==========================================
// РЕДАКТИРОВАНИЕ ПРОФИЛЯ
// ==========================================
function openProfileEditModal() {
    document.getElementById('editProfileName').value = currentUserData.name || '';
    document.getElementById('editProfileUsername').value = currentUserData.username || '';
    document.getElementById('editAvatarLabel').innerHTML = currentUserData.avatar ? `<img src="${currentUserData.avatar}">` : '<i class="fas fa-camera"></i>';
    document.getElementById('editProfileError').textContent = '';
    document.getElementById('profileEditModal').classList.add('active');
}

function previewEditAvatar(input) {
    if(input.files[0]) {
        const r = new FileReader();
        r.onload = e => document.getElementById('editAvatarLabel').innerHTML = `<img src="${e.target.result}">`;
        r.readAsDataURL(input.files[0]);
    }
}

async function saveProfileChanges() {
    const name = document.getElementById('editProfileName').value.trim();
    let username = document.getElementById('editProfileUsername').value.trim().toLowerCase().replace(/@/g, '');
    const errEl = document.getElementById('editProfileError');
    errEl.textContent = '';
    
    if(!name || !username) return errEl.textContent = 'Заполните все поля!';

    try {
        if(username !== currentUserData.username) {
            const snap = await db.collection('users').where('username', '==', username).get();
            if(!snap.empty) throw new Error('Этот юзернейм уже занят!');
        }

        let avatar = currentUserData.avatar;
        const file = document.getElementById('editAvatarInput').files[0];
        if(file) avatar = await compressImage(file, 200);

        await db.collection('users').doc(currentUser.uid).update({ name, username, avatar });
        currentUserData = { ...currentUserData, name, username, avatar };
        document.getElementById('profileEditModal').classList.remove('active');
        loadChats(); // Перезагрузить аватарку в избранном
    } catch(err) { errEl.textContent = err.message; }
}

// ==========================================
// ЧАТЫ И СООБЩЕНИЯ
// ==========================================
function getChatId(uid1, uid2) { return [uid1, uid2].sort().join('_'); }

function loadChats() {
    db.collection('chats').where('participants', 'array-contains', currentUser.uid)
      .orderBy('lastMessageTime', 'desc')
      .onSnapshot(async snap => {
          const list = document.getElementById('chatList');
          list.innerHTML = '';
          addSavedMessagesItem(list);

          for(const doc of snap.docs) {
              const chat = doc.data();
              // Если мы удалили чат у себя, не показываем
              if(chat.deletedBy && chat.deletedBy.includes(currentUser.uid)) continue;

              const otherUid = chat.participants.find(p => p !== currentUser.uid);
              if(!otherUid) continue;

              let user = { name: 'Удаленный', username: '' };
              try {
                  const uDoc = await db.collection('users').doc(otherUid).get();
                  if(uDoc.exists) user = uDoc.data();
              } catch(e){}

              const initial = (user.name || 'U')[0].toUpperCase();
              const unread = chat.unread && chat.unread[currentUser.uid] ? chat.unread[currentUser.uid] : 0;
              
              const div = document.createElement('div');
              div.className = `chat-item ${doc.id===activeChatId ? 'active':''}`;
              div.onclick = () => openChat(doc.id, otherUid, user);
              div.innerHTML = `
                  <div class="chat-avatar">${user.avatar ? `<img src="${user.avatar}">` : initial}</div>
                  <div style="flex:1; min-width:0;">
                      <div style="font-weight:600; font-size:14px;">${user.name}</div>
                      <div style="font-size:13px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                          ${chat.lastMessage || 'Нет сообщений'}
                      </div>
                  </div>
                  ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
              `;
              list.appendChild(div);
          }
      });
}

function addSavedMessagesItem(container) {
    const id = getChatId(currentUser.uid, currentUser.uid);
    const div = document.createElement('div');
    div.className = `chat-item ${id===activeChatId ? 'active':''}`;
    div.onclick = () => openChat(id, currentUser.uid, { name: '🍉 Избранное', online: true });
    div.innerHTML = `
        <div class="chat-avatar" style="background:var(--accent);"><i class="fas fa-bookmark"></i></div>
        <div style="flex:1; font-weight:600; font-size:14px;">Избранное</div>
    `;
    container.appendChild(div);
}

// Поиск людей
let searchTimer;
function searchUsersDB(query) {
    clearTimeout(searchTimer);
    const q = query.trim().toLowerCase().replace('@','');
    const res = document.getElementById('userSearchResults');
    if(q.length < 2) { res.innerHTML=''; return; }

    searchTimer = setTimeout(async () => {
        res.innerHTML = '<p style="color:var(--text-muted);text-align:center;">Ищем...</p>';
        const snap = await db.collection('users').get();
        res.innerHTML = '';
        let count = 0;
        snap.docs.forEach(doc => {
            if(doc.id === currentUser.uid) return;
            const u = doc.data();
            if((u.username && u.username.includes(q)) || (u.name && u.name.toLowerCase().includes(q))) {
                count++;
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.onclick = () => startNewChat(doc.id, u);
                div.innerHTML = `<div class="chat-avatar" style="width:40px;height:40px;">${u.name[0]}</div>
                                 <div><div style="font-weight:600;">${u.name}</div><div style="font-size:12px;color:var(--accent);">@${u.username}</div></div>`;
                res.appendChild(div);
            }
        });
        if(count===0) res.innerHTML='<p style="color:var(--text-muted);text-align:center;">Не найдено</p>';
    }, 500);
}

function filterChats(q) {
    q = q.toLowerCase();
    document.querySelectorAll('#chatList .chat-item').forEach(el => {
        const name = el.innerText.toLowerCase();
        el.style.display = name.includes(q) ? 'flex' : 'none';
    });
}

async function startNewChat(uid, user) {
    const id = getChatId(currentUser.uid, uid);
    const ref = db.collection('chats').doc(id);
    const doc = await ref.get();
    if(!doc.exists) {
        await ref.set({
            participants: [currentUser.uid, uid],
            lastMessage: '',
            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
            deletedBy: []
        });
    } else {
        // Если мы удаляли чат, восстановим его
        await ref.update({ deletedBy: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
    }
    document.getElementById('newChatModal').classList.remove('active');
    openChat(id, uid, user);
}

function openChat(chatId, otherUid, otherUser) {
    activeChatId = chatId;
    activeChatUser = { uid: otherUid, ...otherUser };

    document.getElementById('chatEmpty').style.display = 'none';
    document.getElementById('chatContent').style.display = 'flex';
    document.getElementById('chatHeaderName').textContent = otherUser.name;
    document.getElementById('chatHeaderAvatar').innerHTML = otherUser.avatar ? `<img src="${otherUser.avatar}">` : otherUser.name[0];

    db.collection('chats').doc(chatId).update({ [`unread.${currentUser.uid}`]: 0 }).catch(()=>{});

    if(unsubscribeMessages) unsubscribeMessages();
    unsubscribeMessages = db.collection('chats').doc(chatId).collection('messages')
        .orderBy('timestamp').onSnapshot(snap => {
            const cont = document.getElementById('messagesContainer');
            cont.innerHTML = '';
            snap.docs.forEach(doc => {
                const m = doc.data();
                const isSent = m.sender === currentUser.uid;
                if(!isSent && document.hidden) sendPush(otherUser.name, m.text);
                const div = document.createElement('div');
                div.className = `message-wrapper ${isSent ? 'sent':'received'}`;
                div.innerHTML = `<div class="message">${m.text}</div><div class="message-time">${m.timestamp?m.timestamp.toDate().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):''}</div>`;
                cont.appendChild(div);
            });
            cont.scrollTop = cont.scrollHeight;
        });

    // Подсветка в списке
    document.querySelectorAll('#chatList .chat-item').forEach(el => el.classList.remove('active'));
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if(!text || !activeChatId) return;
    input.value = '';

    await db.collection('chats').doc(activeChatId).collection('messages').add({
        sender: currentUser.uid, text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection('chats').doc(activeChatId).update({
        lastMessage: text,
        lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
        [`unread.${activeChatUser.uid}`]: firebase.firestore.FieldValue.increment(1),
        deletedBy: [] // Возвращаем чат у обоих, если он был удален
    });
}

// УДАЛЕНИЕ ЧАТА
async function deleteChat() {
    if(!activeChatId) return;
    if(confirm('Удалить этот чат из вашего списка? (У собеседника он останется)')) {
        await db.collection('chats').doc(activeChatId).update({
            deletedBy: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
        });
        document.getElementById('chatContent').style.display = 'none';
        document.getElementById('chatEmpty').style.display = 'flex';
        activeChatId = null;
    }
}

// ==========================================
// 📞 WebRTC ЗВОНКИ (Аудио и Видео)
// ==========================================
let peerConnection, currentCallId, callUnsubscribe;
const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

function listenForIncomingCalls() {
    db.collection('calls').where('calleeId', '==', currentUser.uid).onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            if(change.type === 'added') {
                const call = change.doc.data();
                if(!call.answer) {
                    currentCallId = change.doc.id;
                    document.getElementById('incomingCallName').textContent = call.callerName;
                    document.getElementById('incomingCallStatus').textContent = call.type==='video' ? 'Видеозвонок...' : 'Аудиозвонок...';
                    document.getElementById('incomingCallScreen').classList.add('active');
                    sendPush('Звонок 📞', `${call.callerName} звонит вам`);
                }
            }
            if(change.type === 'removed') endCall();
        });
    });
}

async function startWebRTCCall(type) {
    if(!activeChatUser || activeChatUser.uid === currentUser.uid) return alert('Себе звонить нельзя!');
    try {
        const isVideo = type === 'video';
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('localVideo').style.display = isVideo ? 'block' : 'none';
        document.getElementById('activeCallScreen').classList.add('active');
        
        peerConnection = new RTCPeerConnection(servers);
        remoteStream = new MediaStream();
        document.getElementById('remoteVideo').srcObject = remoteStream;

        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        peerConnection.ontrack = e => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

        const callDoc = db.collection('calls').doc();
        currentCallId = callDoc.id;
        
        peerConnection.onicecandidate = e => { if(e.candidate) callDoc.collection('offerCandidates').add(e.candidate.toJSON()); };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await callDoc.set({
            callerId: currentUser.uid, callerName: currentUserData.name, calleeId: activeChatUser.uid, type: type,
            offer: { type: offer.type, sdp: offer.sdp }
        });

        callUnsubscribe = callDoc.onSnapshot(snap => {
            const data = snap.data();
            if(!data) return endCall();
            if(!peerConnection.currentRemoteDescription && data.answer) peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        callDoc.collection('answerCandidates').onSnapshot(snap => {
            snap.docChanges().forEach(change => {
                if(change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            });
        });
    } catch(e) { alert('Ошибка доступа к камере/микрофону: ' + e.message); endCall(); }
}

async function acceptCall() {
    document.getElementById('incomingCallScreen').classList.remove('active');
    try {
        const callDoc = db.collection('calls').doc(currentCallId);
        const data = (await callDoc.get()).data();
        const isVideo = data.type === 'video';
        
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('localVideo').style.display = isVideo ? 'block' : 'none';
        document.getElementById('activeCallScreen').classList.add('active');

        peerConnection = new RTCPeerConnection(servers);
        remoteStream = new MediaStream();
        document.getElementById('remoteVideo').srcObject = remoteStream;

        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        peerConnection.ontrack = e => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

        peerConnection.onicecandidate = e => { if(e.candidate) callDoc.collection('answerCandidates').add(e.candidate.toJSON()); };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await callDoc.update({ answer: { type: answer.type, sdp: answer.sdp }});

        callDoc.collection('offerCandidates').onSnapshot(snap => {
            snap.docChanges().forEach(change => {
                if(change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            });
        });
        
        callUnsubscribe = callDoc.onSnapshot(snap => { if(!snap.exists) endCall(); });
    } catch(e) { alert('Ошибка подключения: ' + e.message); endCall(); }
}

function rejectCall() {
    if(currentCallId) db.collection('calls').doc(currentCallId).delete().catch(()=>{});
    endCall();
}

function endCall() {
    document.getElementById('incomingCallScreen').classList.remove('active');
    document.getElementById('activeCallScreen').classList.remove('active');
    if(currentCallId) db.collection('calls').doc(currentCallId).delete().catch(()=>{});
    currentCallId = null;
    if(callUnsubscribe) callUnsubscribe();
    if(peerConnection) { peerConnection.close(); peerConnection = null; }
    if(localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    document.getElementById('localVideo').srcObject = null;
    document.getElementById('remoteVideo').srcObject = null;
}

function toggleMic() {
    if(!localStream) return;
    const track = localStream.getAudioTracks()[0];
    if(track) {
        track.enabled = !track.enabled;
        document.getElementById('micBtn').style.background = track.enabled ? 'var(--bg-tertiary)' : 'var(--danger)';
        document.getElementById('micBtn').innerHTML = track.enabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
    }
}

function toggleCam() {
    if(!localStream) return;
    const track = localStream.getVideoTracks()[0];
    if(track) {
        track.enabled = !track.enabled;
        document.getElementById('camBtn').style.background = track.enabled ? 'var(--bg-tertiary)' : 'var(--danger)';
        document.getElementById('camBtn').innerHTML = track.enabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
    }
}
