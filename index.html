<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavun — Мессенджер</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* 🍉 Kavun Theme (Арбузная тема) */
            --bg-primary: #0f1712;
            --bg-secondary: #16221a;
            --bg-tertiary: #1f3024;
            --bg-hover: #2a4030;
            --accent: #2ecc71;       /* Зеленый */
            --accent-light: #58d68d;
            --accent-dark: #27ae60;
            --text-primary: #e8f0ea;
            --text-secondary: #88a896;
            --text-muted: #557061;
            --border: #2a4030;
            --success: #2ecc71;
            --danger: #e74c3c;       /* Красный (мякоть) */
            --message-out: #27ae60;
            --message-in: #1f3024;
            --gradient-1: linear-gradient(135deg, #27ae60, #2ecc71);
            --gradient-2: linear-gradient(135deg, #e74c3c, #ff7979);
            --shadow-1: 0 4px 15px rgba(46, 204, 113, 0.3);
            --shadow-2: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 24px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); height:100vh; overflow:hidden; }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }

        /* Вход */
        .auth-screen { position:fixed; inset:0; background:var(--bg-primary); display:flex; align-items:center; justify-content:center; z-index:1000; transition:opacity .5s,visibility .5s; }
        .auth-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .auth-container { width:420px; max-width:95vw; padding:40px 30px; background:var(--bg-secondary); border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-2); text-align:center; }
        .auth-logo { width:70px; height:70px; background:var(--gradient-2); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px; box-shadow:var(--shadow-1); animation:pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0%,100%{box-shadow:0 0 20px rgba(46, 204, 113,.4)} 50%{box-shadow:0 0 40px rgba(46, 204, 113,.7)} }
        .auth-container h1 { font-size:26px; font-weight:700; margin-bottom:6px; background:var(--gradient-1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .auth-container p { color:var(--text-secondary); margin-bottom:24px; font-size:14px; }
        .auth-tabs { display:flex; gap:4px; background:var(--bg-tertiary); border-radius:var(--radius-sm); padding:4px; margin-bottom:24px; }
        .auth-tab { flex:1; padding:10px; border:none; background:transparent; color:var(--text-secondary); cursor:pointer; border-radius:8px; font-weight:500; font-size:14px; transition:all .3s; font-family:inherit; }
        .auth-tab.active { background:var(--accent); color:var(--bg-primary); box-shadow:var(--shadow-1); font-weight:700;}
        .input-group { position:relative; margin-bottom:14px; }
        .input-group i { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px; }
        .input-group input { width:100%; padding:12px 16px 12px 44px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-primary); font-size:14px; font-family:inherit; outline:none; transition:all .3s; }
        .input-group input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(46, 204, 113,.15); }
        .auth-btn { width:100%; padding:12px; background:var(--gradient-1); border:none; border-radius:var(--radius-sm); color:var(--bg-primary); font-size:15px; font-weight:700; cursor:pointer; transition:all .3s; margin-top:8px; font-family:inherit; }
        .auth-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-1); }
        .forgot-link { display:block; margin-top:12px; font-size:13px; color:var(--accent-light); cursor:pointer; }
        .auth-error { color:var(--danger); font-size:13px; margin-top:12px; min-height:20px; word-break:break-word; }
        .avatar-upload label { width:65px; height:65px; border-radius:50%; background:var(--bg-tertiary); border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; cursor:pointer; overflow:hidden; }
        .avatar-upload label img { width:100%; height:100%; object-fit:cover; }
        .register-fields { display:none; } .register-fields.active { display:block; }

        /* Приложение */
        .app { display:flex; height:100vh; opacity:0; visibility:hidden; transition:opacity .5s; }
        .app.visible { opacity:1; visibility:visible; }
        .sidebar { width:360px; min-width:360px; background:var(--bg-secondary); border-right:1px solid var(--border); display:flex; flex-direction:column; }
        .sidebar-header { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
        .sidebar-header h2 { font-size:22px; font-weight:700; background:var(--gradient-2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .icon-btn { width:38px; height:38px; border-radius:50%; border:none; background:var(--bg-tertiary); color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .3s; font-size:14px; }
        .icon-btn:hover { background:var(--accent); color:var(--bg-primary); transform:scale(1.05); }
        .search-box { padding:12px 20px; position:relative; }
        .search-box input { width:100%; padding:10px 16px 10px 40px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:25px; color:var(--text-primary); font-size:13px; outline:none; }
        .search-box i { position:absolute; left:36px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:13px; }
        
        .chat-list { flex:1; overflow-y:auto; padding:8px; }
        .chat-item { display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--radius-sm); cursor:pointer; transition:all .2s; }
        .chat-item:hover { background:var(--bg-hover); }
        .chat-item.active { background:var(--bg-tertiary); border:1px solid var(--border); }
        .chat-avatar { width:48px; height:48px; border-radius:50%; background:var(--gradient-1); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:18px; color:var(--bg-primary); flex-shrink:0; position:relative; overflow:hidden; }
        .chat-avatar img { width:100%; height:100%; object-fit:cover; }
        .online-dot { width:12px; height:12px; background:var(--success); border:2px solid var(--bg-secondary); border-radius:50%; position:absolute; bottom:0; right:0; }
        
        .chat-area { flex:1; display:flex; flex-direction:column; background:var(--bg-primary); }
        .chat-header { padding:12px 24px; display:flex; justify-content:space-between; border-bottom:1px solid var(--border); background:var(--bg-secondary); }
        
        .messages-container { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:4px; }
        .message-wrapper { display:flex; flex-direction:column; max-width:70%; position:relative; }
        .message-wrapper.sent { align-self:flex-end; } .message-wrapper.received { align-self:flex-start; }
        .message { padding:10px 16px; border-radius:18px; font-size:14px; line-height:1.5; word-wrap:break-word; }
        .message-wrapper.sent .message { background:var(--message-out); border-bottom-right-radius:6px; color:var(--bg-primary); font-weight:500;}
        .message-wrapper.received .message { background:var(--message-in); border-bottom-left-radius:6px; border:1px solid var(--border); }
        .message-time { font-size:10px; color:var(--text-muted); margin-top:4px; text-align:right; }
        
        /* Звонки (WebRTC) */
        .call-screen { position:fixed; inset:0; background:rgba(15, 23, 18, 0.95); z-index:2000; display:none; flex-direction:column; align-items:center; justify-content:center; }
        .call-screen.active { display:flex; }
        .call-avatar-large { width:120px; height:120px; border-radius:50%; background:var(--gradient-1); display:flex; align-items:center; justify-content:center; font-size:48px; margin-bottom:24px; animation:call-pulse 1.5s infinite; overflow:hidden; }
        .call-avatar-large img { width:100%; height:100%; object-fit:cover; }
        @keyframes call-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(46, 204, 113,.5)} 50%{box-shadow:0 0 0 30px rgba(46, 204, 113,0)} }
        
        .video-call-container { position:fixed; inset:0; z-index:2000; background:#000; display:none; }
        .video-call-container.active { display:flex; }
        .remote-video { width:100%; height:100%; object-fit:cover; }
        .local-video { position:absolute; top:20px; right:20px; width:150px; height:200px; border-radius:var(--radius-sm); overflow:hidden; border:2px solid var(--accent); z-index:2010;}
        .local-video video { width:100%; height:100%; object-fit:cover; transform: scaleX(-1); }
        
        .call-controls { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:flex; gap:20px; z-index:2010;}
        .call-btn { width:60px; height:60px; border-radius:50%; border:none; cursor:pointer; font-size:22px; color:white; transition:all .3s; display:flex; align-items:center; justify-content:center;}
        .call-btn.accept { background:var(--success); color:var(--bg-primary);}
        .call-btn.reject { background:var(--danger); }
        .call-btn.action { background:var(--bg-tertiary); }

        /* Инпуты, модалки и прочее (сокращено для места, работает как раньше) */
        .input-area { padding:16px 24px; border-top:1px solid var(--border); background:var(--bg-secondary); }
        .input-bar { display:flex; align-items:flex-end; gap:12px; }
        .input-text { flex:1; padding:10px 16px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:24px; color:var(--text-primary); font-size:14px; outline:none; resize:none; max-height:120px; min-height:40px; }
        .send-btn { width:44px; height:44px; border-radius:50%; border:none; background:var(--gradient-1); color:var(--bg-primary); cursor:pointer; }
        
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:1100; display:none; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal { width:420px; background:var(--bg-secondary); border-radius:var(--radius); padding:28px; border:1px solid var(--border); }
        
        .user-list-item { display:flex; align-items:center; gap:12px; padding:10px; border-radius:var(--radius-sm); cursor:pointer; }
        .user-list-item:hover { background:var(--bg-hover); }
        .user-list-item .username { font-size:12px; color:var(--accent); }
    </style>
</head>
<body>

<!-- ВХОД / РЕГА -->
<div class="auth-screen" id="authScreen">
    <div class="auth-container">
        <div class="auth-logo"><i class="fas fa-watermelon"></i> 🍉</div>
        <h1>Kavun</h1>
        <p>Сочный мессенджер</p>
        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTabBtn" onclick="switchAuthTab('login')">Вход</button>
            <button class="auth-tab" id="registerTabBtn" onclick="switchAuthTab('register')">Регистрация</button>
        </div>
        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="register-fields" id="registerFields">
                <div class="avatar-upload">
                    <label for="avatarInput" id="avatarLabel"><i class="fas fa-camera"></i></label>
                    <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(this)">
                </div>
                <div class="input-group">
                    <input type="text" id="regName" placeholder="Ваше Имя (Например: Иван)">
                    <i class="fas fa-font"></i>
                </div>
                <div class="input-group">
                    <input type="text" id="regUsername" placeholder="Юзернейм (Например: ivan99)">
                    <i class="fas fa-at"></i>
                </div>
            </div>
            <div class="input-group">
                <input type="email" id="authEmail" placeholder="Email" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" id="authPassword" placeholder="Пароль" required minlength="6">
                <i class="fas fa-lock"></i>
            </div>
            <button type="submit" class="auth-btn" id="authBtn">Войти</button>
            <div class="auth-error" id="authError"></div>
        </form>
    </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div class="app" id="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🍉 Kavun</h2>
            <div class="sidebar-actions">
                <button class="icon-btn" onclick="openNewChatModal()" title="Новый чат"><i class="fas fa-edit"></i></button>
                <button class="icon-btn" onclick="logout()" title="Выйти"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Поиск чатов..." oninput="searchChats(this.value)">
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="chat-area" id="chatArea">
        <div id="chatEmpty" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted);">
            <i class="fas fa-seedling" style="font-size:60px; margin-bottom:20px; color:var(--accent);"></i>
            <h3>Выберите чат</h3>
        </div>
        
        <div id="chatContent" style="display:none; flex:1; flex-direction:column;">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="chat-avatar" id="chatHeaderAvatar">U</div>
                    <div>
                        <div style="font-weight:600;" id="chatHeaderName">User</div>
                        <div style="font-size:12px; color:var(--accent);" id="chatHeaderStatus">онлайн</div>
                    </div>
                </div>
                <div style="display:flex; gap:8px;">
                    <!-- Кнопки звонка WebRTC -->
                    <button class="icon-btn" onclick="startWebRTCCall('audio')" title="Аудиозвонок"><i class="fas fa-phone"></i></button>
                    <button class="icon-btn" onclick="startWebRTCCall('video')" title="Видеозвонок"><i class="fas fa-video"></i></button>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            
            <div class="input-area">
                <div class="input-bar">
                    <textarea class="input-text" id="messageInput" placeholder="Сообщение..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
                    <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ПОИСК И ДОБАВЛЕНИЕ КОНТАКТА -->
<div class="modal-overlay" id="newChatModal">
    <div class="modal">
        <h3>🔍 Найти контакт</h3>
        <p style="font-size:13px; color:var(--text-secondary); margin-bottom:15px;">Введите @юзернейм, email или имя</p>
        <div class="input-group">
            <input type="text" id="findUserInput" placeholder="@username или email" oninput="searchUsersDB(this.value)">
            <i class="fas fa-search"></i>
        </div>
        <div id="userSearchResults" style="max-height:250px; overflow-y:auto;"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="auth-btn" style="background:var(--bg-tertiary); color:white;" onclick="document.getElementById('newChatModal').classList.remove('active')">Закрыть</button>
        </div>
    </div>
</div>

<!-- ЭКРАН ВХОДЯЩЕГО / ИСХОДЯЩЕГО ЗВОНКА -->
<div class="call-screen" id="incomingCallScreen">
    <div class="call-avatar-large" id="incomingCallAvatar"><i class="fas fa-phone"></i></div>
    <h2 id="incomingCallName" style="margin-bottom:10px;">User</h2>
    <p id="incomingCallStatus" style="color:var(--accent); margin-bottom:40px;">Входящий видеозвонок...</p>
    <div class="call-controls">
        <button class="call-btn reject" onclick="rejectCall()"><i class="fas fa-phone-slash"></i></button>
        <button class="call-btn accept" id="acceptCallBtn" onclick="acceptCall()"><i class="fas fa-phone"></i></button>
    </div>
</div>

<!-- ЭКРАН САМОГО ВИДЕОЗВОНКА -->
<div class="video-call-container" id="activeCallScreen">
    <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
    <div class="local-video"><video id="localVideo" autoplay playsinline muted></video></div>
    <div class="call-controls">
        <button class="call-btn action" onclick="toggleMic()" id="micBtn"><i class="fas fa-microphone"></i></button>
        <button class="call-btn reject" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
        <button class="call-btn action" onclick="toggleCam()" id="camBtn"><i class="fas fa-video"></i></button>
    </div>
</div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
// 1. КОНФИГ FIREBASE
const firebaseConfig = {
    apiKey: "AIzaSyBKiUSqJi_Ah1WiA8zbE3kv5LK34x0y6Wk",
    authDomain: "kavun-503cd.firebaseapp.com",
    projectId: "kavun-503cd",
    storageBucket: "kavun-503cd.firebasestorage.app",
    messagingSenderId: "381618417793",
    appId: "1:381618417793:web:a52ac7a726da6fd01add80"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
let currentUser = null;
let currentUserData = null;
let activeChatId = null;
let activeChatUser = null;
let unsubscribeMessages = null;

// ПЕРЕМЕННЫЕ WEBRTC (ЗВОНКИ)
let localStream = null;
let remoteStream = null;
let peerConnection = null;
let currentCallId = null;
let callUnsubscribe = null;
let incomingCallType = 'audio';

const servers = {
    iceServers: [
        { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
    ]
};

// ЗАПРОС УВЕДОМЛЕНИЙ
if (Notification.permission !== "granted" && Notification.permission !== "denied") {
    Notification.requestPermission();
}

function sendPush(title, body) {
    if (Notification.permission === "granted" && document.hidden) {
        new Notification(title, { body: body, icon: '🍉' });
    }
}

// ==========================================
// АВТОРИЗАЦИЯ И РЕГИСТРАЦИЯ (С ЮЗЕРНЕЙМАМИ)
// ==========================================
let authMode = 'login';
function switchAuthTab(mode) {
    authMode = mode;
    document.getElementById('loginTabBtn').classList.toggle('active', mode==='login');
    document.getElementById('registerTabBtn').classList.toggle('active', mode==='register');
    document.getElementById('registerFields').classList.toggle('active', mode==='register');
    document.getElementById('authBtn').textContent = mode==='login' ? 'Войти' : 'Создать аккаунт Kavun';
    document.getElementById('authError').textContent = '';
}

function previewAvatar(input) {
    if (input.files[0]) {
        const r = new FileReader();
        r.onload = e => document.getElementById('avatarLabel').innerHTML = `<img src="${e.target.result}">`;
        r.readAsDataURL(input.files[0]);
    }
}

async function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errorEl = document.getElementById('authError');
    errorEl.textContent = 'Обработка...';

    try {
        if (authMode === 'register') {
            const name = document.getElementById('regName').value.trim() || 'Без имени';
            let username = document.getElementById('regUsername').value.trim().toLowerCase().replace(/@/g, '');
            if (!username) username = 'id' + Date.now();

            // Проверка на занятость юзернейма
            const unCheck = await db.collection('users').where('username', '==', username).get();
            if (!unCheck.empty) throw new Error('Этот юзернейм уже занят!');

            const cred = await auth.createUserWithEmailAndPassword(email, password);
            
            // Сжимаем аватар
            let avatarBase64 = '';
            const file = document.getElementById('avatarInput').files[0];
            if (file) {
                avatarBase64 = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = ev => r(ev.target.result); // Упрощенное чтение для скорости
                    reader.readAsDataURL(file);
                });
            }

            await db.collection('users').doc(cred.user.uid).set({
                name, username, email, avatar: avatarBase64, online: true
            });
            await cred.user.updateProfile({ displayName: name });
        } else {
            await auth.signInWithEmailAndPassword(email, password);
        }
    } catch (err) {
        errorEl.textContent = err.message.includes('юзернейм') ? err.message : 'Ошибка входа. Проверьте данные.';
    }
}

auth.onAuthStateChanged(async user => {
    if (user) {
        currentUser = user;
        const doc = await db.collection('users').doc(user.uid).get();
        currentUserData = doc.data();
        
        await db.collection('users').doc(user.uid).update({ online: true });
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('app').classList.add('visible');
        loadChats();
        listenForIncomingCalls(); // Слушаем звонки
    } else {
        currentUser = null;
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('app').classList.remove('visible');
    }
});

function logout() { auth.signOut(); }

// ==========================================
// ЧАТЫ И ИЗБРАННОЕ (СОХРАНЕНКИ)
// ==========================================
function getChatId(uid1, uid2) { return [uid1, uid2].sort().join('_'); }

function loadChats() {
    db.collection('chats').where('participants', 'array-contains', currentUser.uid)
      .orderBy('lastMessageTime', 'desc')
      .onSnapshot(async snapshot => {
          const chatList = document.getElementById('chatList');
          chatList.innerHTML = '';
          
          // Создаем системный элемент "Избранное"
          addSavedMessagesItem(chatList);

          for (const doc of snapshot.docs) {
              const chat = doc.data();
              const otherUid = chat.participants.find(p => p !== currentUser.uid);
              if (!otherUid) continue; // Это избранное, оно уже добавлено

              let otherUser = { name: 'Удаленный аккаунт', username: '' };
              try {
                  const uDoc = await db.collection('users').doc(otherUid).get();
                  if (uDoc.exists) otherUser = uDoc.data();
              } catch(e){}

              const initial = (otherUser.name || 'U')[0].toUpperCase();
              const div = document.createElement('div');
              div.className = 'chat-item';
              div.onclick = () => openChat(doc.id, otherUid, otherUser);
              
              div.innerHTML = `
                  <div class="chat-avatar">${otherUser.avatar ? `<img src="${otherUser.avatar}">` : initial}</div>
                  <div style="flex:1; min-width:0;">
                      <div style="font-weight:600; font-size:14px;">${otherUser.name}</div>
                      <div style="font-size:13px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                          ${chat.lastMessage || 'Начните чат'}
                      </div>
                  </div>
              `;
              chatList.appendChild(div);
          }
      });
}

function addSavedMessagesItem(container) {
    const savedId = getChatId(currentUser.uid, currentUser.uid);
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.onclick = () => openChat(savedId, currentUser.uid, { name: '🍉 Избранное', online: true });
    div.innerHTML = `
        <div class="chat-avatar" style="background:var(--accent);"><i class="fas fa-bookmark"></i></div>
        <div style="flex:1; font-weight:600; font-size:14px;">Избранное</div>
    `;
    container.appendChild(div);
}

// ==========================================
// ПОИСК ПО @USERNAME И EMAIL
// ==========================================
function openNewChatModal() { document.getElementById('newChatModal').classList.add('active'); }

let searchTimer;
function searchUsersDB(query) {
    clearTimeout(searchTimer);
    const q = query.trim().toLowerCase().replace('@','');
    const res = document.getElementById('userSearchResults');
    
    if (q.length < 2) { res.innerHTML = ''; return; }

    searchTimer = setTimeout(async () => {
        res.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Ищем...</p>';
        try {
            const snap = await db.collection('users').get();
            res.innerHTML = '';
            let found = 0;
            snap.docs.forEach(doc => {
                if (doc.id === currentUser.uid) return;
                const u = doc.data();
                if ((u.username && u.username.includes(q)) || (u.email && u.email.includes(q)) || (u.name && u.name.toLowerCase().includes(q))) {
                    found++;
                    const div = document.createElement('div');
                    div.className = 'user-list-item';
                    div.onclick = () => startNewChat(doc.id, u);
                    div.innerHTML = `
                        <div class="chat-avatar" style="width:40px;height:40px;">${u.name[0]}</div>
                        <div>
                            <div style="font-weight:600;">${u.name}</div>
                            <div class="username">@${u.username}</div>
                        </div>
                    `;
                    res.appendChild(div);
                }
            });
            if (found===0) res.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Ничего не найдено</p>';
        } catch (e) { res.innerHTML = 'Ошибка поиска'; }
    }, 500);
}

async function startNewChat(uid, user) {
    const chatId = getChatId(currentUser.uid, uid);
    const ref = db.collection('chats').doc(chatId);
    const doc = await ref.get();
    if (!doc.exists) {
        await ref.set({
            participants: [currentUser.uid, uid],
            lastMessage: '',
            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
    document.getElementById('newChatModal').classList.remove('active');
    openChat(chatId, uid, user);
}

// ==========================================
// СООБЩЕНИЯ
// ==========================================
function openChat(chatId, otherUid, otherUser) {
    activeChatId = chatId;
    activeChatUser = { uid: otherUid, ...otherUser };

    document.getElementById('chatEmpty').style.display = 'none';
    document.getElementById('chatContent').style.display = 'flex';
    document.getElementById('chatHeaderName').textContent = otherUser.name;
    document.getElementById('chatHeaderAvatar').innerHTML = otherUser.avatar ? `<img src="${otherUser.avatar}">` : otherUser.name[0];

    if (unsubscribeMessages) unsubscribeMessages();
    
    unsubscribeMessages = db.collection('chats').doc(chatId).collection('messages')
        .orderBy('timestamp')
        .onSnapshot(snap => {
            const cont = document.getElementById('messagesContainer');
            cont.innerHTML = '';
            snap.docs.forEach(doc => {
                const msg = doc.data();
                const isSent = msg.sender === currentUser.uid;
                
                // Уведомление, если пришло новое сообщение не от меня
                if (!isSent && document.hidden) sendPush(otherUser.name, msg.text);

                const div = document.createElement('div');
                div.className = `message-wrapper ${isSent ? 'sent' : 'received'}`;
                div.innerHTML = `<div class="message">${msg.text}</div>`;
                cont.appendChild(div);
            });
            cont.scrollTop = cont.scrollHeight;
        });
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !activeChatId) return;
    input.value = '';

    await db.collection('chats').doc(activeChatId).collection('messages').add({
        sender: currentUser.uid,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection('chats').doc(activeChatId).update({
        lastMessage: text,
        lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
    });
}

// ==========================================
// 📞 НАСТОЯЩИЕ ЗВОНКИ (WebRTC + FIRESTORE)
// ==========================================

// 1. СЛУШАТЬ ВХОДЯЩИЕ ЗВОНКИ
function listenForIncomingCalls() {
    db.collection('calls').where('calleeId', '==', currentUser.uid)
      .onSnapshot(snapshot => {
          snapshot.docChanges().forEach(change => {
              if (change.type === 'added') {
                  const callData = change.doc.data();
                  if (!callData.answer) {
                      // Входящий звонок
                      currentCallId = change.doc.id;
                      incomingCallType = callData.type;
                      document.getElementById('incomingCallName').textContent = callData.callerName;
                      document.getElementById('incomingCallStatus').textContent = callData.type === 'video' ? 'Входящий видеозвонок...' : 'Входящий аудиозвонок...';
                      document.getElementById('incomingCallScreen').classList.add('active');
                      sendPush('Входящий звонок 📞', `Вам звонит ${callData.callerName}`);
                  }
              }
              // Если звонящий сбросил
              if (change.type === 'removed') {
                  endCall();
              }
          });
      });
}

// 2. НАЧАТЬ ЗВОНОК (Инициатор)
async function startWebRTCCall(type) {
    if (!activeChatUser || activeChatUser.uid === currentUser.uid) return alert('Себе звонить нельзя!');
    
    document.getElementById('activeCallScreen').classList.add('active');
    
    // Получаем камеру/микрофон
    localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
    document.getElementById('localVideo').srcObject = localStream;

    peerConnection = new RTCPeerConnection(servers);
    remoteStream = new MediaStream();
    document.getElementById('remoteVideo').srcObject = remoteStream;

    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = event => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    // Создаем документ звонка
    const callDoc = db.collection('calls').doc();
    currentCallId = callDoc.id;
    const offerCandidates = callDoc.collection('offerCandidates');
    const answerCandidates = callDoc.collection('answerCandidates');

    peerConnection.onicecandidate = event => {
        if (event.candidate) offerCandidates.add(event.candidate.toJSON());
    };

    // Создаем Offer
    const offerDescription = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offerDescription);

    const callData = {
        callerId: currentUser.uid,
        callerName: currentUserData.name,
        calleeId: activeChatUser.uid,
        type: type,
        offer: { type: offerDescription.type, sdp: offerDescription.sdp }
    };
    await callDoc.set(callData);

    // Ждем Answer
    callUnsubscribe = callDoc.onSnapshot(snapshot => {
        const data = snapshot.data();
        if (!data) return endCall(); // Звонок отклонен/завершен
        if (!peerConnection.currentRemoteDescription && data.answer) {
            const answerDescription = new RTCSessionDescription(data.answer);
            peerConnection.setRemoteDescription(answerDescription);
        }
    });

    // Слушаем Ice кандидатов от собеседника
    answerCandidates.onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
            if (change.type === 'added') {
                const candidate = new RTCIceCandidate(change.doc.data());
                peerConnection.addIceCandidate(candidate);
            }
        });
    });
}

// 3. ПРИНЯТЬ ЗВОНОК
async function acceptCall() {
    document.getElementById('incomingCallScreen').classList.remove('active');
    document.getElementById('activeCallScreen').classList.add('active');

    const callDoc = db.collection('calls').doc(currentCallId);
    const callData = (await callDoc.get()).data();
    
    localStream = await navigator.mediaDevices.getUserMedia({ video: callData.type === 'video', audio: true });
    document.getElementById('localVideo').srcObject = localStream;

    peerConnection = new RTCPeerConnection(servers);
    remoteStream = new MediaStream();
    document.getElementById('remoteVideo').srcObject = remoteStream;

    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = event => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const offerCandidates = callDoc.collection('offerCandidates');
    const answerCandidates = callDoc.collection('answerCandidates');

    peerConnection.onicecandidate = event => {
        if (event.candidate) answerCandidates.add(event.candidate.toJSON());
    };

    // Принимаем Offer, создаем Answer
    const offerDescription = new RTCSessionDescription(callData.offer);
    await peerConnection.setRemoteDescription(offerDescription);

    const answerDescription = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answerDescription);

    await callDoc.update({
        answer: { type: answerDescription.type, sdp: answerDescription.sdp }
    });

    offerCandidates.onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
            if (change.type === 'added') {
                let data = change.doc.data();
                peerConnection.addIceCandidate(new RTCIceCandidate(data));
            }
        });
    });
    
    callUnsubscribe = callDoc.onSnapshot(snap => {
        if(!snap.exists) endCall();
    });
}

// 4. ОТКЛОНИТЬ / ЗАВЕРШИТЬ
async function rejectCall() {
    if (currentCallId) {
        await db.collection('calls').doc(currentCallId).delete().catch(()=>{});
    }
    endCall();
}

function endCall() {
    document.getElementById('incomingCallScreen').classList.remove('active');
    document.getElementById('activeCallScreen').classList.remove('active');
    
    if (currentCallId) {
        db.collection('calls').doc(currentCallId).delete().catch(()=>{});
        currentCallId = null;
    }
    if (callUnsubscribe) callUnsubscribe();
    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }
    document.getElementById('localVideo').srcObject = null;
    document.getElementById('remoteVideo').srcObject = null;
}

// Управление микро/камерой во время звонка
function toggleMic() {
    if(!localStream) return;
    const track = localStream.getAudioTracks()[0];
    track.enabled = !track.enabled;
    document.getElementById('micBtn').style.background = track.enabled ? 'var(--bg-tertiary)' : 'var(--danger)';
}
function toggleCam() {
    if(!localStream) return;
    const track = localStream.getVideoTracks()[0];
    if(track) {
        track.enabled = !track.enabled;
        document.getElementById('camBtn').style.background = track.enabled ? 'var(--bg-tertiary)' : 'var(--danger)';
    }
}
